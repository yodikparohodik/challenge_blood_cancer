models:
  SimpleCNN:
    type: cnn
    layers:
      - type: conv2d
        filters: 32
        kernel_size: 3
        activation: relu
      - type: maxpool
        pool_size: 2
      - type: conv2d
        filters: 64
        kernel_size: 3
        activation: relu
      - type: maxpool
        pool_size: 2
      - type: flatten
      - type: dense
        units: 128
        activation: relu
      - type: dropout
        rate: 0.5
      - type: dense
        units: 10
        activation: softmax
    
    input_shape: [64, 64, 3]
    num_classes: 10

  MiniCNN:
    type: cnn
    layers:
      - type: conv2d
        filters: 16
        kernel_size: 3
        activation: relu
      - type: maxpool
        pool_size: 2
      - type: flatten
      - type: dense
        units: 64
        activation: relu
      - type: dense
        units: 10
        activation: softmax
    
    input_shape: [64, 64, 3]
    num_classes: 10
