system:
  seed: 42
  log_level: INFO
  data_dir: data
  save_every_round: true

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 10
  optimizer: adam
  patience: 5

teacher:
  initial_degradation_probs:
    gaussian_noise: 0.11
    salt_pepper: 0.11
    blur: 0.11
    brightness: 0.11
    contrast: 0.11
    rotation: 0.11
    occlusion: 0.11
    compression: 0.11
    distortion: 0.12
  adaptation_rate: 0.1
  max_probability: 0.4
  min_probability: 0.05

student:
  model_type: SimpleCNN
  num_classes: 10
  input_size: [64, 64, 3]
